<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Export</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
        }
        .team-section {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #1a2a2a, #0d1515);
            border-radius: 8px;
        }
        .team-sprites {
            display: flex;
            gap: 0.5rem;
        }
        .team-sprites img {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
        }
        .team-info h3 {
            font-family: 'VT323', monospace;
            color: #7fdbca;
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }
        .team-info p {
            color: #a0a0a0;
            font-size: 0.9rem;
            font-family: system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div class="team-section">
        <div class="team-sprites">
            <img src="images/ggj-2026/sprites/P_front.png" alt="Catherine">
            <img src="images/ggj-2026/sprites/P_front.png" alt="Hanif">
            <img src="images/ggj-2026/sprites/Z_front.png" alt="Clinton">
        </div>
        <div class="team-info">
            <h3>THE TEAM</h3>
            <p>Catherine, Hanif & Clinton</p>
        </div>
    </div>
</body>
</html>
